<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineStream - Player Limpo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cyber: {
              bg: '#0a0a0f',
              card: '#12121a',
              accent: '#00ff88',
              border: '#1f1f2e'
            }
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #0a0a0f; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; }
    .neon-border:focus { box-shadow: 0 0 10px rgba(0, 255, 136, 0.4); }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <header class="border-b border-cyber-border bg-cyber-card/80 backdrop-blur sticky top-0 z-50 p-4">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
      <h1 class="text-2xl font-bold tracking-wider text-white flex items-center gap-2">
        <span class="text-cyber-accent">CYBER</span>STREAM
      </h1>
      
      <div class="relative w-full md:w-96">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Buscar filme no TMDB..." 
          class="w-full bg-cyber-bg border border-cyber-border rounded-lg px-4 py-2 text-sm text-white focus:outline-none border-cyber-accent/50 neon-border transition"
        />
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto p-4 space-y-8">
    <!-- Section Player Limpo -->
    <section class="space-y-3">
      <h2 id="playerTitle" class="text-xl font-semibold text-cyber-accent flex items-center gap-2">
        <span>▶</span> Assistindo: Shrek 2
      </h2>
      
      <!-- Container do vídeo sem nenhuma marca ou UI do Telegram -->
      <div class="relative w-full aspect-video bg-black rounded-xl overflow-hidden border border-cyber-border shadow-2xl flex items-center justify-center">
        <video 
          id="videoPlayer" 
          controls 
          autoplay
          playsinline
          class="w-full h-full object-contain"
          poster="https://image.tmdb.org/t/p/w1280/9Rj12ipB16R3qUChJ3I327B4R0B.jpg"
        >
          <!-- URL direta do arquivo MP4 extraído -->
          <source id="videoSource" src="https://stream.telegram.org/file/zzzzzkth/2/shrek2.mp4" type="video/mp4" />
          Seu navegador não suporta a exibição deste vídeo.
        </video>
      </div>
    </section>

    <!-- Grid de Busca TMDB -->
    <section>
      <h3 id="resultsHeading" class="text-lg font-medium text-gray-400 mb-4">Filmes Populares (TMDB)</h3>
      <div id="resultsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
        <!-- Renderizado via JS -->
      </div>
    </section>
  </main>

  <script type="module" src="/main.js"></script>
</body>
</html>
