<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineStream - Player</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cyber: {
              bg: '#0a0a0f',
              card: '#12121a',
              accent: '#00ff88',
              border: '#1f1f2e'
            }
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #0a0a0f; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; }
    .neon-border:focus { box-shadow: 0 0 10px rgba(0, 255, 136, 0.4); }
    
    /* Ad blocker overlay - absorve o anúncio do primeiro toque */
    #ad-interceptor {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 10;
      background: transparent;
      cursor: pointer;
    }
    #ad-interceptor.consumed { display: none; }
    
    .tab-btn.active {
      color: #00ff88 !important;
      border-bottom: 2px solid #00ff88;
    }
    
    .tab-btn { border-bottom: 2px solid transparent; }
    
    /* Episode selector */
    .episode-card.active-ep {
      border-color: #00ff88 !important;
      background-color: rgba(0, 255, 136, 0.1);
    }
    
    /* Hide scrollbar for season slider */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <header class="border-b border-cyber-border bg-cyber-card/80 backdrop-blur sticky top-0 z-50 p-4">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
      <h1 class="text-2xl font-bold tracking-wider text-white flex items-center gap-2">
        <span class="text-cyber-accent">CYBER</span>STREAM
      </h1>
      
      <div class="flex gap-2 items-center w-full md:w-auto">
        <!-- Tabs: Filmes / Séries -->
        <button id="tabMovies" class="tab-btn active px-4 py-2 text-sm font-medium text-gray-400 hover:text-white transition">
          🎬 Filmes
        </button>
        <button id="tabSeries" class="tab-btn px-4 py-2 text-sm font-medium text-gray-400 hover:text-white transition">
          📺 Séries
        </button>
      </div>
      
      <div class="relative w-full md:w-96">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Buscar no TMDB..." 
          class="w-full bg-cyber-bg border border-cyber-border rounded-lg px-4 py-2 text-sm text-white focus:outline-none border-cyber-accent/50 neon-border transition"
        />
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto p-4 space-y-8">
    
    <!-- Player -->
    <section class="space-y-3">
      <h2 id="playerTitle" class="text-xl font-semibold text-cyber-accent flex items-center gap-2">
        <span>▶</span> Selecione um conteúdo para assistir
      </h2>
      
      <div class="relative w-full aspect-video bg-black rounded-xl overflow-hidden border border-cyber-border shadow-2xl">
        <iframe 
          id="videoPlayer" 
          src="about:blank" 
          class="w-full h-full border-none"
          allowfullscreen 
          allow="autoplay; encrypted-media; picture-in-picture"
          scrolling="no"
          referrerpolicy="no-referrer-when-downgrade"
        ></iframe>
        <!-- Overlay que engole o anúncio do primeiro toque -->
        <div id="ad-interceptor"></div>
      </div>
      
      <!-- Seletor de Temporadas/Episódios (só aparece para séries) -->
      <div id="seriesControls" class="hidden space-y-3">
        <div>
          <h3 class="text-sm text-gray-400 mb-2">Temporada:</h3>
          <div id="seasonsSlider" class="flex gap-2 overflow-x-auto no-scrollbar pb-2"></div>
        </div>
        <div>
          <h3 class="text-sm text-gray-400 mb-2">Episódios:</h3>
          <div id="episodesGrid" class="grid grid-cols-3 sm:grid-cols-6 md:grid-cols-10 gap-2"></div>
        </div>
      </div>
    </section>

    <!-- Catálogo -->
    <section>
      <h3 id="resultsHeading" class="text-lg font-medium text-gray-400 mb-4">Populares no TMDB</h3>
      <div id="resultsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4"></div>
    </section>
  </main>

  <script type="module" src="/main.js"></script>
</body>
</html>
